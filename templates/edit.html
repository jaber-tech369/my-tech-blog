<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>পোস্ট পরিবর্তন করুন</title>
    <link rel="stylesheet" href="/static/style.css"> <!-- আমাদের তৈরি সিএসএস লিংক -->
</head>
<body>
    <div style="max-width: 600px; margin: 50px auto;" class="card">
        <h3 style="margin-top: 0;">আপনার ব্লগ পোস্টটি পরিবর্তন করুন:</h3>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>পোস্টের শিরোনাম:</label>
                <input type="text" name="title" value="{{ post.title }}" required class="form-control">
            </div>
            <div class="form-group">
                <label>মূল কন্টেন্ট বা লেখা:</label>
                <textarea name="content" required class="form-control" rows="6">{{ post.content }}</textarea>
            </div>
            <div class="form-group">
                <label>নতুন ছবি (পরিবর্তন করতে চাইলে):</label>
                <input type="file" name="image_file" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn-submit" style="background-color: #42b72a;">পরিবর্তনগুলো সেভ করুন</button>
            <a href="{% url 'home' %}" style="display: block; text-align: center; margin-top: 15px; color: #65676b; text-decoration: none; font-weight: bold;">ফিরে যান</a>
        </form>
    </div>
        
</body>
</html>
